<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <radialGradient id="g" cx="78%" cy="20%" r="95%">
      <stop offset="0" stop-color="#8C4C62"/><stop offset=".5" stop-color="#5C2E3E"/><stop offset="1" stop-color="#2E131F"/>
    </radialGradient>
    <style>
      .bar{transform-box:fill-box;transform-origin:bottom;animation:b 3.4s ease-in-out infinite}
      @keyframes b{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.62)}}
      @media (prefers-reduced-motion:reduce){.bar{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#g)"/>
  <circle cx="1010" cy="40" r="210" fill="none" stroke="#C7A46A" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="1010" cy="40" r="290" fill="none" stroke="#C7A46A" stroke-opacity=".16" stroke-width="2"/>
  <g transform="translate(70,74)">
    <rect class="bar" x="0" y="20" width="10" height="26" rx="4" fill="#F6F1EA"/>
    <rect class="bar" x="15" y="6" width="10" height="40" rx="4" fill="#F6F1EA" style="animation-delay:.2s"/>
    <rect class="bar" x="30" y="14" width="10" height="32" rx="4" fill="#C7A46A" style="animation-delay:.4s"/>
    <rect class="bar" x="45" y="0" width="10" height="46" rx="4" fill="#F6F1EA" style="animation-delay:.6s"/>
    <text x="74" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#F6F1EA">lidiana<tspan fill="#C7A46A">.</tspan></text>
  </g>
  <text x="70" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#FFF8F0">From scattered systems to <tspan font-style="italic" fill="#E6CC92">clear answers.</tspan></text>
